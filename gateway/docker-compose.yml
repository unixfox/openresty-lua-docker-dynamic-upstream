services:
  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    environment:
      - DISCOVERY_INTERVAL=${DISCOVERY_INTERVAL:-2}
      - NETWORK_NAME=${NETWORK_NAME:-gateway_net}
      - UPSTREAMS=${UPSTREAMS:-app-web,app-api}
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - gateway_net

networks:
  gateway_net:
    name: gateway_net
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: "172.28.0.0/16"
        - subnet: "fd12:3456:789a::/64"
