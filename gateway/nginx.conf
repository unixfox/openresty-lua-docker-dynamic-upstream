worker_processes auto;
error_log /dev/stderr notice;

env DISCOVERY_INTERVAL;
env NETWORK_NAME;
env UPSTREAMS;
env DOCKER_HOST;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;

    # Required for Lua cosockets to resolve Docker service hostnames.
    resolver 127.0.0.11 valid=5s ipv6=off;

    lua_package_path "/etc/nginx/lua/?.lua;;";

    init_worker_by_lua_block {
        local init = require("init")
        init.start()
    }

    upstream app-web {
        zone app-web 256k;
        server 0.0.0.1 down;
    }

    upstream app-api {
        zone app-api 256k;
        server 0.0.0.1 down;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name web.localhost;

        location / {
            proxy_pass http://app-web;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            proxy_connect_timeout      5s;
            proxy_read_timeout         30s;
            proxy_next_upstream        error timeout http_502 http_503;
            proxy_next_upstream_tries  3;
        }
    }

    server {
        listen 80;
        listen [::]:80;
        server_name api.localhost;

        location / {
            proxy_pass http://app-api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            proxy_connect_timeout      5s;
            proxy_read_timeout         30s;
            proxy_next_upstream        error timeout http_502 http_503;
            proxy_next_upstream_tries  3;
        }
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location /gateway/status {
            content_by_lua_block {
                local discovery = require("discovery")
                discovery.status()
            }
        }

        location /gateway/health {
            return 200 "ok\n";
        }

        location / {
            return 503 '{"error":"no server configured for this host"}\n';
            default_type application/json;
        }
    }
}
